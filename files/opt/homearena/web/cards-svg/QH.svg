      <!-- 注意：v0.11.0 去掉了「中央小花色」。
           原先在袍子正中放一枚金色花色，本意是加强辨识，实测是**脏**：
           它和袍子的金色菱形叠在一起，缩到 20px 宽时糊成一团泥。
